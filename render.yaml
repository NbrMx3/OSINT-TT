services:
  - type: web
    name: osint-x-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run db:generate && npm run db:migrate:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
