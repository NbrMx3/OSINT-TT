services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kipkemoi
      POSTGRES_USER: kipkemoi
      POSTGRES_PASSWORD: kipkemoi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kipkemoi -d kipkemoi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

